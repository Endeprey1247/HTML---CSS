<body>
    <form action="process.php" method="post">
        <label for="name">Name:</label>
        <input type="text" name="name" placeholder="name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="email" required><br><br>

        <label for="ps">Password:</label>
        <input type="password" name="ps" placeholder="password" minlength="6" required><br><br>

        <label for="number">Age:</label>
        <input type="number name="number" placeholder="age" min="15" max="20" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>L
        <input type="radio" id="female" name="gender" value="female" required>F<br><br>

        <label for="hobby">Hobby:</label>
        <input type="checkbox" name="hobby" value="writing">Writing
        <input type="checkbox" name="hobby" value="drawing">Drawing
        <input type="checkbox" name="hobby" value="gaming">Gaming
        <input type="checkbox" name="hobby" value="reading">Reading
        <input type="checkbox" name="hobby" value="coding">Coding<br><br>

        <label for="class">Class:</label>
        <select name="class" required>
            <option value="">Select your class</option>
            <option value="XI RPL 1">XI RPL 1</option>
            <option value="XI RPL 2">XI RPL 2</option>
            <option value="XI TKJ 1">XI TKJ 1</option>
            <option value="XI TKJ 2">XI TKJ 2</option>
        </select><br><br>

        <textarea name="message" rows="4" cols="50" placeholder="Your message here..."></textarea><br><br>
        
    </form>
